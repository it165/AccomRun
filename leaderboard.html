<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
    <title>Accom RUN 2026 - Leaderboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #f7f9ff; -webkit-tap-highlight-color: transparent; padding-bottom: env(safe-area-inset-bottom); }
        .font-plus { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; }
        .custom-shadow { box-shadow: 0px 4px 20px rgba(0, 108, 64, 0.06); }
        .medal-1 { color: #FFD700; text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3); } 
        .medal-2 { color: #C0C0C0; text-shadow: 0 2px 4px rgba(192, 192, 192, 0.3); } 
        .medal-3 { color: #CD7F32; text-shadow: 0 2px 4px rgba(205, 127, 50, 0.3); } 
    </style>
</head>
<body class="text-slate-800">

<!-- Header -->
<header class="fixed top-0 w-full z-40 bg-purple-700 shadow-md flex justify-between items-center px-5 h-16" style="padding-top: env(safe-area-inset-top); height: calc(4rem + env(safe-area-inset-top));">
    <div class="flex items-center gap-2">
        <a href="index.html" class="material-symbols-outlined text-white p-2">arrow_back</a>
        <h1 class="font-plus font-bold text-white text-lg tracking-tight">Top 5 ประจำหอพัก</h1>
    </div>
    <span class="material-symbols-outlined text-white opacity-80">social_leaderboard</span>
</header>

<main class="pt-28 px-5 pb-24 max-w-lg mx-auto">
    <div class="text-center mb-6">
        <h2 class="font-plus text-2xl font-bold text-purple-800">Leaderboard</h2>
        <p class="text-sm text-slate-500">5 อันดับผู้ที่สะสมระยะทางได้มากที่สุดของแต่ละหอพัก</p>
    </div>

    <!-- พื้นที่แสดงข้อมูล Leaderboard -->
    <div id="leaderboardContainer" class="space-y-6"></div>
</main>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="fixed inset-0 bg-white/80 z-[60] flex items-center justify-center backdrop-blur-sm">
    <div class="flex flex-col items-center">
        <span class="material-symbols-outlined text-purple-600 text-5xl animate-spin mb-3">sync</span>
        <p class="font-plus font-bold text-purple-800">กำลังจัดอันดับ...</p>
    </div>
</div>

<script>
    // 🚨🚨 นำ GAS URL ของคุณมาใส่ที่นี่
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyeKxJiRsDWXnI8onqW1IqT5LMQMQ6JdLqSAwA2BiI68QC5eq1-xODhdAn64xjbrkXeww/exec"; 

    document.addEventListener("DOMContentLoaded", function() {
        loadLeaderboard();
    });

    function loadLeaderboard() {
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getLeaderboard' })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loadingOverlay').classList.add('hidden');
            const container = document.getElementById('leaderboardContainer');
            
            if (!data.success || data.data.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center custom-shadow border border-slate-100"><p class="text-slate-500 font-semibold">ยังไม่มีข้อมูลการเดินในระบบ</p></div>`;
                return;
            }

            let html = '';
            
            data.data.forEach(dormData => {
                html += `
                <div class="bg-white rounded-2xl overflow-hidden custom-shadow border border-slate-100 mb-6">
                    <div class="bg-purple-50 px-4 py-3 border-b border-purple-100 flex items-center gap-2">
                        <span class="material-symbols-outlined text-purple-600">apartment</span>
                        <h3 class="font-plus font-bold text-purple-800 text-lg">${dormData.dorm}</h3>
                    </div>
                    <div class="divide-y divide-slate-100">
                `;

                dormData.runners.forEach((runner, index) => {
                    let rankIcon = '';
                    let rankText = `<span class="text-slate-400 font-bold w-6 text-center">${index + 1}</span>`;

                    if (index === 0) { rankIcon = '<span class="material-symbols-outlined medal-1 text-2xl">workspace_premium</span>'; rankText = ''; }
                    else if (index === 1) { rankIcon = '<span class="material-symbols-outlined medal-2 text-2xl">workspace_premium</span>'; rankText = ''; }
                    else if (index === 2) { rankIcon = '<span class="material-symbols-outlined medal-3 text-2xl">workspace_premium</span>'; rankText = ''; }

                    html += `
                        <div class="px-4 py-3 flex items-center justify-between hover:bg-slate-50 transition-colors">
                            <div class="flex items-center gap-3 w-3/4">
                                <div class="w-8 flex justify-center items-center shrink-0">
                                    ${rankText} ${rankIcon}
                                </div>
                                <!-- 🟢 รูปโปรไฟล์ LINE -->
                                <div class="w-10 h-10 rounded-full overflow-hidden border border-slate-200 shrink-0 bg-slate-100">
                                    <img src="${runner.pic}" class="w-full h-full object-cover">
                                </div>
                                <!-- 🟢 ชื่อ LINE -->
                                <p class="font-semibold text-slate-700 truncate">${runner.name}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <p class="font-plus font-bold text-purple-600">${runner.km.toFixed(2)}</p>
                                <p class="text-[10px] uppercase text-slate-400 font-semibold leading-none">Km</p>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        })
        .catch(err => {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('leaderboardContainer').innerHTML = `<p class="text-center text-red-500">โหลดข้อมูลไม่สำเร็จ</p>`;
        });
    }
</script>

</body>
</html>
